<meta charset="utf-8">
<title>Department of Justice</title>
<link rel="stylesheet" href="https://cfx-nui-whip_core/html/css/fonts.css">

<body>
<div id="app" class="hidden">
  <div class="shell doj">
    <aside class="rail">
      <div class="brand" id="brand">
        <div class="brand-logo" id="brand-logo">⚖</div>
        <div class="brand-text"><div class="brand-short" id="brand-short">DOJ</div><div class="brand-name" id="brand-name">Department of Justice</div></div>
      </div>
      <nav id="nav" class="nav"></nav>
      <div class="me" id="me"></div>
    </aside>
    <main class="main">
      <header class="top">
        <div class="search" id="gsearch-wrap">
          <span class="s-ico">⌕</span>
          <input id="gsearch" type="text" placeholder="Search people or case numbers…  (Ctrl+K)" autocomplete="off" spellcheck="false">
          <div id="gsearch-pop" class="pop hidden"></div>
        </div>
        <div class="top-right">
          <span id="viewas" class="pill accent hidden"></span>
          <span id="duty" class="duty"></span>
          <button class="btn small hidden" id="to-mdt" title="Switch to your police department's MDT">⛨ Police MDT</button>
          <button class="icon-btn" data-act="close" title="Close (Esc)">✕</button>
        </div>
      </header>
      <div id="ro-banner" class="ro-banner hidden"></div>
      <section id="view" class="view"></section>
    </main>
  </div>
  <div id="modal" class="modal hidden"><div class="modal-card" id="modal-card"></div></div>
  <div id="lightbox" class="lightbox hidden"><button class="lb-x" title="Close">✕</button><img id="lb-img" alt=""><div class="lb-cap" id="lb-cap"></div></div>
  <div id="toast" class="toast"></div>
</div>
